# =============================================================================
# 盘神AI资源站 — 配置文件
# =============================================================================

# 主题：default | minimal-mono | editorial-serif | neo-brutalism
#   glassmorphism | terminal-retro | paper-card | newsprint
theme: glassmorphism

# 语言
lang: "zh-CN"

# 配色：auto（跟随系统）| light（浅色）| dark（深色）
color_scheme: auto

# =============================================================================
# 插件（不需要的都删掉了）
# =============================================================================
plugins:

# =============================================================================
# 页面头部信息
# =============================================================================
title: "盘神AI资源站"
avatar: "./images/profile.jpeg"
name: "盘神AI资源站"
tagline: >-
    免费分享影视、软件、学习资料、AI工具、网赚项目等优质资源，全部夸克网盘直链下载。

# =============================================================================
# 资源链接列表
#   icon  — 图标（https://fontawesome.com/search?o=r&m=free）
#   text  — 显示文字
#   url   — 跳转链接（改成你自己的夸克网盘链接）
#   target — _blank（新标签打开）
# =============================================================================
links:
