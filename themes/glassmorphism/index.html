<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }} - 精选网盘资源分享</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  min-height: 100vh;
  padding: 20px;
}
.container { max-width: 1200px; margin: 0 auto; }
.header { text-align: center; color: white; margin-bottom: 40px; padding-top: 20px; }
.header h1 { font-size: 36px; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
.header p { font-size: 16px; opacity: 0.9; }
.search-box { max-width: 500px; margin: 20px auto; position: relative; }
.search-box input {
  width: 100%; padding: 14px 20px; border: none; border-radius: 50px;
  font-size: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.15); outline: none;
}
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-bottom: 40px; }
.card {
  display: block; background: white; border-radius: 16px; padding: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  transition: transform 0.3s, box-shadow 0.3s; text-decoration: none;
}
.card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.25); }
.card-icon { font-size: 40px; margin-bottom: 15px; }
.card h3 { color: #333; font-size: 20px; margin-bottom: 8px; }
.card p { color: #888; font-size: 14px; line-height: 1.6; }
.card .count {
  display: inline-block; margin-top: 12px; padding: 4px 12px;
  background: #f0f4ff; color: #667eea; border-radius: 20px; font-size: 12px; font-weight: 600;
}
.footer { text-align: center; color: white; padding: 30px 0; opacity: 0.8; font-size: 13px; line-height: 1.8; }
.footer a { color: white; text-decoration: none; border-bottom: 1px dashed rgba(255,255,255,0.5); }
@media (max-width: 600px) { .header h1 { font-size: 28px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🔮 {{ title }}</h1>
    <p>{{ tagline }}</p>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索资源分类..." oninput="filterCards()">
    </div>
  </div>

  <div class="grid" id="cardGrid">
    {% for c in categories %}
    <a class="card" data-name="{{ c.name }} {{ c.desc }}" href="{{ c.url }}">
      <div class="card-icon">{{ c.icon }}</div>
      <h3>{{ c.name }}</h3>
      <p>{{ c.desc }}</p>
      <span class="count">资源持续更新中</span>
    </a>
    {% endfor %}
  </div>

  <div class="footer">
    <p>{{ footer }}</p>
    <p>{{ copyright }}</p>
  </div>
</div>

<script>
function filterCards() {
  const keyword = document.getElementById('searchInput').value.toLowerCase();
  const cards = document.querySelectorAll('.card');
  cards.forEach(card => {
    const name = card.dataset.name.toLowerCase();
    card.style.display = name.includes(keyword) ? 'block' : 'none';
  });
}
</script>
</body>
</html>
